<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    浏览器标签页的图标，必须和页面左上角的 logo 一致，所以直接用 lucide 的
    package 图标（顶栏是 <Package class="h-5 w-5 text-primary" />）。

    描边色取 --primary 的实际 sRGB 值：oklch(0.55 0.12 35) = #ac543f
    （用 canvas 栅格化取的，不是我手算的）。换成 oklch() 写法在部分
    浏览器标签页 / 收藏夹场景下不认，所以固化成了 hex。
    换主题色时记得两处一起改。
  -->
  <g fill="none" stroke="#ac543f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" />
    <path d="M12 22V12" />
    <polyline points="3.29 7 12 12 20.71 7" />
    <path d="m7.5 4.27 9 5.15" />
  </g>
</svg>
