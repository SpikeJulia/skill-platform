services:
  skill-platform:
    build: .
    image: skill-platform:latest
    container_name: skill-platform
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"  # 仅本机
    volumes:
      # PB SQLite 数据 + 上传文件
      # ⚠️ 必须挂到 /app/pb_data：PB 未设 --dir，默认数据目录是相对启动目录（WORKDIR=/app）的 ./pb_data
      - ~/AI/skill-platform-data:/app/pb_data
      # 中央源（可写：平台的「安装新 skill」要能真正落盘）
      # ⚠️ 之前挂 :ro 导致 POST /api/install/content 直接报 read-only file system
      - ~/AI/agent-skills:/skills
      # 专属源（同样需要可写）
      - ~/AI/agent-skills-personal:/personal
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
